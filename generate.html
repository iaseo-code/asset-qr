<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 코드 생성 - 자산 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard",-apple-system,sans-serif;background:#f2f2f7;color:#1c1c1e;min-height:100vh}
.hd{background:linear-gradient(145deg,#1c1c1e,#2c2c2e);padding:28px 20px 24px}
.hd-b{font-size:10px;font-weight:600;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.hd-t{font-size:22px;font-weight:800;color:#fff}
.hd-s{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px}
.ct{max-width:700px;margin:0 auto;padding:20px 16px 40px}
.sec{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.lb{font-size:14px;font-weight:700;margin-bottom:8px}
.sub{font-size:12px;color:#8e8e93;margin-bottom:12px}
textarea{width:100%;height:120px;padding:12px;border-radius:12px;border:2px solid #e5e5ea;font-size:13px;font-family:"SF Mono","Fira Code",monospace;resize:vertical;outline:none;-webkit-appearance:none}
textarea:focus{border-color:#1c1c1e}
.br{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:"Pretendard",sans-serif;-webkit-appearance:none}
.btn:active{opacity:0.8}
/* 3번 목표: 검은색 버튼으로 변경 */
.bp{background:#1c1c1e;color:#fff} 
.bo{background:#fff;color:#1c1c1e;border:2px solid #e5e5ea}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.qi{background:#fff;border-radius:0;padding:16px 12px;text-align:center;border:1px dashed #ccc;box-shadow:none}
.qi svg{display:block;margin:0 auto 8px}
.ql{font-size:12px;font-weight:700;font-family:"SF Mono","Fira Code",monospace;color:#1c1c1e}
.tip{margin-top:20px;padding:14px 16px;background:#fff8e1;border-radius:12px;border:1px solid #ffe082;font-size:12px;color:#6d4c00;line-height:1.7}
.lk{margin-top:16px;text-align:center}
.lk a{font-size:13px;color:#007aff;text-decoration:none;font-weight:600}
@media print{
  .np{display:none!important}
  body{background:#fff}
  .ct{padding:0;max-width:100%}
  
  /* 1. 한 줄에 5칸 나오던 걸 8칸~10칸으로 늘려서 박스를 확 줄입니다 */
  .grid{grid-template-columns:repeat(12, 1fr); gap:4px}
  
  /* 2. 테두리와 여백도 최소화합니다 */
  .qi{border:1px dashed #ccc; padding:1mm; break-inside:avoid; width:15mm; height:18mm; border-radius:0}
  
  /* 3. 💡 핵심: QR 코드 그림 자체의 크기를 물리적 크기(12mm)로 강제 고정합니다! */
 .qi svg{display:block; width:13mm; height:13mm; margin:0 auto 0.5mm}
  
  /* 4. 관리번호 글씨도 QR 크기에 맞춰서 아주 작게 줄입니다 */
 .ql{font-size:7pt; letter-spacing:-0.5px}
}
</style>
</head>
<body>
<div class="hd np">
<div class="hd-b">🖥️ 비바웨이브 · 피플팀</div>
<div class="hd-t">QR 코드 생성</div>
</div>
<div class="ct">
<div class="sec np">
<div class="lb">관리번호 입력</div>
<div class="sub">줄바꿈 또는 쉼표로 구분 (예: MO-25-01, LPTP-25-02)</div>
<textarea id="ids" placeholder="MO-25-01&#10;MO-25-02&#10;MO-25-03"></textarea>
<div class="br">
<button class="btn bp" onclick="gen(false)">선택 QR 생성</button>
<button class="btn bo" onclick="genAll()">전체 일괄 생성</button>
<button class="btn bo" onclick="window.print()">🖨️ 인쇄</button>
</div>
</div>
<div id="out"></div>
<div class="lk np"><a href="./index.html">← 자산 조회 페이지로 이동</a></div>
</div>

<script>
var API="https://script.google.com/macros/s/AKfycbyQxzWNkmlwfOm5MTuUoO6dqUGMPImUITJql3Wb9eBNGbQvxe1v4TFSFvVei4n_DGfM9g/exec";
var BASE="https://iaseo-code.github.io/asset-qr/";
var validIds = [];
var isLoaded = false;

// 5번 목표 검증을 위해: 페이지 열릴 때 미리 시트의 모든 관리번호를 불러옵니다.
window.onload = function() {
    var cb="_cb"+Date.now();
    window[cb]=function(d){
        delete window[cb];
        if(d && d.ids) {
            validIds = d.ids;
            isLoaded = true;
        }
    };
    var sc=document.createElement("script");
    sc.src=API+"?action=getAll&callback="+cb;
    document.body.appendChild(sc);
};

// 4번 목표: 시트에 있는 모든 데이터의 QR을 한 번에 생성
function genAll() {
    if(!isLoaded) { alert("시트 데이터를 불러오는 중입니다. 잠시만 기다려주세요."); return; }
    if(validIds.length === 0) { alert("시트에 자산 데이터가 없습니다."); return; }
    document.getElementById("ids").value = validIds.join("\n");
    gen(true);
}

// QR 생성 함수 (isAll: 전체 생성 여부)
function gen(isAll){
    if(!isLoaded) { alert("시트 데이터를 불러오는 중입니다. 잠시만 기다려주세요."); return; }
    var t=document.getElementById("ids").value;
    var ids=t.split(/[\n,]+/).map(function(s){return s.trim().toUpperCase()}).filter(Boolean);
    if(ids.length===0){alert("관리번호를 입력해 주세요.");return;}
    
    var c=document.getElementById("out");
    c.innerHTML='<div class="grid"></div>';
    var g=c.querySelector(".grid");
    
    var notFound = [];
    ids.forEach(function(id){
        // 5번 목표: 시트에 번호가 없으면 생성하지 않고 제외 목록에 넣음
        if(validIds.indexOf(id) === -1) {
            notFound.push(id);
            return; 
        }
        var url=BASE+"?id="+encodeURIComponent(id);
        var qr=qrcode(0,"L");
        qr.addData(url);
        qr.make();
        var item=document.createElement("div");
        item.className="qi";
        item.innerHTML=qr.createSvgTag(3,0)+'<div class="ql">'+id+'</div>';
        g.appendChild(item);
    });
    
    // 사용자가 직접 입력해서 생성할 때(전체 생성이 아닐 때), 없는 번호가 있었다면 알림
    if(notFound.length > 0 && !isAll) {
        alert("다음 관리번호는 시트에 존재하지 않아 생성이 취소되었습니다:\n" + notFound.join(", "));
    }
    
    if(g.innerHTML !== "") {
        c.innerHTML+='<div class="tip np"><strong>💡 인쇄 팁:</strong> Ctrl+P (또는 ⌘+P)로 인쇄하세요. USB용은 10~15mm 크기의 투명 라벨지에 출력하면 좋습니다. 방수 라미네이팅 처리 권장!</div>';
    }
}
</script>
</body>
</html>
