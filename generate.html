<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 코드 생성 - 자산 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard",-apple-system,sans-serif;background:#f4f4f8;color:#0f0f1a;min-height:100vh}
.header{background:#0f0f1a;padding:28px 20px 24px}
.header-badge{font-size:10px;font-weight:600;color:rgba(255,255,255,0.35);letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px}
.header-title{font-size:22px;font-weight:800;color:#fff}
.header-sub{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px}
.content{max-width:700px;margin:0 auto;padding:20px 16px 40px}
.section{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.label{font-size:13px;font-weight:700;margin-bottom:8px}
.sub{font-size:12px;color:#6b7280;margin-bottom:12px}
textarea{width:100%;height:120px;padding:12px;border-radius:10px;border:2px solid #e5e7eb;font-size:13px;font-family:"SF Mono","Fira Code",monospace;resize:vertical;outline:none}
textarea:focus{border-color:#0f0f1a}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:"Pretendard",sans-serif}
.btn:active{opacity:0.8}
.btn-primary{background:#0f0f1a;color:#fff}
.btn-outline{background:#fff;color:#0f0f1a;border:2px solid #e5e7eb}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.qr-item{background:#fff;border-radius:14px;padding:16px 12px;text-align:center;border:1px solid #e5e7eb}
.qr-item svg{display:block;margin:0 auto 8px}
.qr-label{font-size:12px;font-weight:700;font-family:"SF Mono","Fira Code",monospace;color:#0f0f1a}
.tip{margin-top:20px;padding:14px 16px;background:#fffbeb;border-radius:12px;border:1px solid #fde68a;font-size:12px;color:#92400e;line-height:1.7}
.link{margin-top:12px;text-align:center}
.link a{font-size:13px;color:#2563eb;text-decoration:none;font-weight:600}
@media print{
.no-print{display:none!important}
body{background:#fff}
.content{padding:0;max-width:100%}
.qr-grid{grid-template-columns:repeat(5,1fr);gap:8px}
.qr-item{border:1px solid #ddd;padding:10px 8px;break-inside:avoid}
}
</style>
</head>
<body>
<div class="header no-print">
<div class="header-badge">🏭 피플팀 · 자산관리</div>
<div class="header-title">QR 코드 일괄 생성</div>
<div class="header-sub">관리번호를 입력하면 인쇄용 QR 코드를 생성합니다</div>
</div>
<div class="content">
<div class="section no-print">
<div class="label">관리번호 입력</div>
<div class="sub">줄바꿈 또는 쉼표로 구분하여 여러 개를 입력하세요 (예: EHD-25-01, EHD-25-02)</div>
<textarea id="ids" placeholder="EHD-25-01&#10;EHD-25-02&#10;EHD-25-03"></textarea>
<div class="btn-row">
<button class="btn btn-primary" onclick="gen()">QR 코드 생성</button>
<button class="btn btn-outline" onclick="window.print()">🖨️ 인쇄</button>
</div>
</div>
<div id="out"></div>
<div class="link no-print"><a href="./">← 자산 조회 페이지로 이동</a></div>
</div>
<script>
var BASE="https://iaseo-code.github.io/asset-qr/index.html";
function gen(){
var text=document.getElementById("ids").value;
var ids=text.split(/[\n,]+/).map(function(s){return s.trim().toUpperCase()}).filter(Boolean);
if(ids.length===0){alert("관리번호를 입력해 주세요.");return}
var c=document.getElementById("out");
c.innerHTML='<div class="qr-grid"></div>';
var g=c.querySelector(".qr-grid");
ids.forEach(function(id){
var url=BASE+"?id="+encodeURIComponent(id);
var qr=qrcode(0,"M");
qr.addData(url);
qr.make();
var item=document.createElement("div");
item.className="qr-item";
item.innerHTML=qr.createSvgTag(3,0)+'<div class="qr-label">'+id+"</div>";
g.appendChild(item)
});
c.innerHTML+='<div class="tip no-print"><strong>💡 인쇄 팁:</strong> Ctrl+P (또는 ⌘+P)로 인쇄하세요. USB용은 10~15mm 크기의 투명 라벨지에 출력하면 좋습니다. 방수 라미네이팅 처리 권장!</div>'
}
</script>
</body>
</html>
